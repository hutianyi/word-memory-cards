name: WordMemoryCards

options:
  bundleIdPrefix: com.hutianyi
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "3"

targets:
  WordMemoryCards:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/WordMemoryCards
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hutianyi.WordMemoryCards
        PRODUCT_NAME: WordMemoryCards
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "单词卡片"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  WordMemoryCardsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests/WordMemoryCardsTests
    dependencies:
      - target: WordMemoryCards
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.hutianyi.WordMemoryCardsTests
        SWIFT_VERSION: "5.0"

  WordMemoryCardsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests/WordMemoryCardsUITests
    dependencies:
      - target: WordMemoryCards
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.hutianyi.WordMemoryCardsUITests
        SWIFT_VERSION: "5.0"

schemes:
  WordMemoryCards:
    build:
      targets:
        WordMemoryCards: all
        WordMemoryCardsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - WordMemoryCardsTests
        - WordMemoryCardsUITests
    archive:
      config: Release
